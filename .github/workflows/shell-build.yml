name: Shell build
# Build the unsigned, game-content-free shell (tools/shell_build.py): a build input that users
# pack with their own game files on their own machine (tools/dr3_pack.py). No game files, keys,
# shaders or derived content are needed or produced here.
on:
  workflow_dispatch:
  push:
    branches: [shell-build]
    tags: ['shell-v*']
permissions:
  contents: read
jobs:
  shell:
    # iOS 26 SDK required (platform/ios/project.yml deploymentTarget). macos-26 carries Xcode 26;
    # adjust if GitHub renames the image.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          brew install xcodegen
      # 缓存已移除：bootstrap 主力路径走 Release 快照 zip（零 API 调用，解压几秒），缓存不再有收益；
      # 且缓存树的「patch 已应用」判定是假阳性（git 对新建 diff 的逆应用只查存在性不查内容），
      # 树过期时 patch 静默不重应用、删除还有传播延迟——这类坑 2026-11-04 连吃三轮，直接根除。
      # | Cache removed: the bootstrap fast path is the Release snapshot zip (zero API calls,
      # | seconds to unzip), so caching buys nothing; worse, the "patch already applied" probe is
      # | a false positive on stale trees (git apply --reverse --check for new-file diffs only
      # | checks existence), and deleted entries kept being served — bit us three times in a row.
      - name: Restore pinned snapshot (release asset)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMMIT: '9579030e5b1f0443c12b7376559560915b6d4c4b'
        run: |
          if [ ! -d third_party/nxnative/dm ]; then
            # 主力路径：Release 资产里的 pinned 快照 = 纯孤儿树（git archive HEAD，不含补丁状态）——
            # bootstrap 每轮把当前 patch 真实应用一遍，zip 与 patch 解耦、永不静默过期
            # | Fast path: the pinned snapshot = the bare orphan tree (git archive HEAD, no patch
            # | state). bootstrap then truly applies the current patch each run, so the zip and
            # | the patch can never silently drift apart.
            gh release download nxnative-s9579030 --repo "$GITHUB_REPOSITORY" --pattern 'nxnative-s9579030.zip' --output third_party/snap.zip
            mkdir -p third_party/nxnative
            cd third_party/nxnative
            python3 -c "import zipfile; zipfile.ZipFile('../snap.zip').extractall('.')"
            rm -f ../snap.zip
            echo "$COMMIT" > .dm-pinned
          fi
      - name: Bootstrap pinned upstream
        env:
          GITHUB_TOKEN: ${{ github.token }}   # 快照缺失时的兜底：孤儿提交经 GitHub API 树重建 | fallback when the snapshot is missing
        run: python3 tools/dr3.py bootstrap
      - name: Chain inputs digest (diagnostics)
        env:
          DM_GAME: 01001B300B9BE000
        run: python3 -I tools/chain_debug.py
      - name: Build the shell
        run: python3 tools/shell_build.py --out work/shell
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: work/shell/build.log
          if-no-files-found: ignore
      - name: Upload shell
        uses: actions/upload-artifact@v4
        with:
          name: DR3Mobile-shell-build-input
          path: |
            work/shell/DR3Mobile-shell-build-input.zip
            work/shell/shell_manifest.txt
          if-no-files-found: error
      - name: Release (shell-v* tags only)
        if: startsWith(github.ref, 'refs/tags/shell-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            work/shell/DR3Mobile-shell-build-input.zip
            work/shell/shell_manifest.txt
