name: Shell build
# Build the unsigned, game-content-free shell (tools/shell_build.py): a build input that users
# pack with their own game files on their own machine (tools/dr3_pack.py). No game files, keys,
# shaders or derived content are needed or produced here.
on:
  workflow_dispatch:
  push:
    branches: [shell-build]
    tags: ['shell-v*']
permissions:
  contents: read
jobs:
  shell:
    # iOS 26 SDK required (platform/ios/project.yml deploymentTarget). macos-26 carries Xcode 26;
    # adjust if GitHub renames the image.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          brew install xcodegen
      - name: Cache bootstrapped upstream
        uses: actions/cache@v4
        with:
          # 命中即跳过 API 树重建（一次重建几百次调用，是 403 限流的根源）；键 = 钉死提交 + 补丁摘要
          # | A hit skips the API-heavy tree rebuild (hundreds of calls; the 403 source); key = pinned commit + patch digest
          path: third_party/nxnative
          key: nxnative-${{ hashFiles('third_party/nxnative/.dm-pinned', 'patches/nxnative.patch') }}
      - name: Bootstrap pinned upstream
        env:
          GITHUB_TOKEN: ${{ github.token }}   # 上游孤儿提交只能经 GitHub API 树重建 | the pinned orphan commit is rebuilt through the GitHub API
        run: python3 tools/dr3.py bootstrap
      - name: Chain inputs digest (diagnostics)
        env:
          DM_GAME: 01001B300B9BE000
        run: python3 -I tools/chain_debug.py
      - name: Build the shell
        run: python3 tools/shell_build.py --out work/shell
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: work/shell/build.log
          if-no-files-found: ignore
      - name: Upload shell
        uses: actions/upload-artifact@v4
        with:
          name: DR3Mobile-shell-build-input
          path: |
            work/shell/DR3Mobile-shell-build-input.zip
            work/shell/shell_manifest.txt
          if-no-files-found: error
      - name: Release (shell-v* tags only)
        if: startsWith(github.ref, 'refs/tags/shell-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            work/shell/DR3Mobile-shell-build-input.zip
            work/shell/shell_manifest.txt
